<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #1f2937;
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Nunito', system-ui, Arial;
            color: #e6eef8;
        }

        /* Background image (replace with namkinh.png in same folder) */
        body {
            background: url('namkinh.png') center/cover no-repeat fixed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Top navigation */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 48px;
            gap: 20px;
            pointer-events: none;
        }

        .logo {
            font-weight: 800;
            font-size: 26px;
            color: #fff;
            filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.6));
            pointer-events: auto;
        }

        .nav {
            display: flex;
            gap: 28px;
            align-items: center;
            pointer-events: auto;
        }

        .nav a {
            color: rgba(255, 255, 255, 0.92);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 6px;
            transition: background .18s, transform .12s;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        /* Modal center */
        .modal-wrap {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass {
            width: 420px;
            max-width: 92%;
            border-radius: 18px;
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            box-shadow: 0 12px 40px rgba(2, 6, 23, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            padding: 34px 36px 26px;
            position: relative;
            color: #0f1724;
            backdrop-filter: blur(8px) saturate(120%);
            -webkit-backdrop-filter: blur(8px) saturate(120%);
            overflow: hidden;
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.12));
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .close-btn {
            position: absolute;
            right: 14px;
            top: 10px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-grid;
            place-items: center;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            cursor: pointer;
            z-index: 5;
        }

        h1 {
            margin: 6px 0 18px;
            text-align: center;
            font-size: 28px;
            color: #0b1220;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.02);
            font-weight: 800;
        }

        form .field {
            margin: 18px 6px;
            position: relative;
        }

        label {
            display: block;
            font-size: 13px;
            color: rgba(11, 17, 32, 0.55);
            margin-bottom: 10px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(11, 17, 32, 0.12);
            padding: 12px 38px 10px 10px;
            font-size: 15px;
            outline: none;
            color: #071226;
        }

        input::placeholder {
            color: rgba(11, 17, 32, 0.25);
        }

        .icon {
            position: absolute;
            right: 8px;
            top: 34px;
            opacity: 0.6;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(11, 17, 32, 0.6);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(11, 17, 32, 0.55);
            font-size: 14px;
        }

        .forgot {
            color: rgba(11, 17, 32, 0.65);
            font-weight: 600;
            text-decoration: none;
            font-size: 13px;
        }

        .btn {
            margin-top: 18px;
            width: 100%;
            display: inline-block;
            background: #0f1724;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(2, 6, 23, 0.45);
        }

        .small {
            margin-top: 14px;
            font-size: 13px;
            color: rgba(11, 17, 32, 0.55);
            text-align: center;
        }

        .small a {
            color: rgba(11, 17, 32, 0.9);
            font-weight: 700;
            text-decoration: none;
        }

        /* show/hide modal */
        .hidden {
            display: none !important;
        }

        /* responsive tweaks */
        @media (max-width:520px) {
            .topbar {
                padding: 16px;
            }

            .glass {
                padding: 22px;
                border-radius: 14px;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="logo">Logo</div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <a id="openLogin" href="#"
                style="border:1px solid rgba(255,255,255,0.22); padding:8px 14px; border-radius:8px;">Login</a>
        </nav>
    </header>

    <main class="modal-wrap">
        <section id="loginModal" class="glass" role="dialog" aria-labelledby="loginTitle">
            <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>

            <h1 id="loginTitle">Login</h1>

            <form id="loginForm" autocomplete="on" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="your@email.com" required>
                    <span class="icon" aria-hidden="true">📧</span>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" required>
                    <span class="icon" aria-hidden="true">🔒</span>
                </div>

                <div class="row">
                    <label class="checkbox"><input type="checkbox" name="remember"> Remember me</label>
                    <a class="forgot" href="#">Forget Password?</a>
                </div>

                <button class="btn" type="submit">Login</button>

                <div class="small">Don't have an account? <a href="#">Register</a></div>
            </form>
        </section>
    </main>

    <script>
        // basic open/close behavior — modal visible by default to match the reference image
        const modal = document.getElementById('loginModal');
        const closeBtn = document.getElementById('closeBtn');
        const openBtn = document.getElementById('openLogin');

        closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
        openBtn.addEventListener('click', (e) => {
            e.preventDefault();
            modal.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // simple submit demo (prevent actual submit)
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            // place your login logic here
            alert('Đã nhấn Login (demo)'); // small demo feedback
        });
    </script>
</body>

</html>
