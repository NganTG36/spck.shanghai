<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="topbar">
        <div class="logo">Logo</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="modal-wrap">
        <section class="glass" role="form" aria-labelledby="registerTitle">
            <h1 id="registerTitle">Register</h1>

            <form id="registerForm" autocomplete="on" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Your username" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="your@email.com" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" required>
                </div>

                <button class="btn" type="submit">Register</button>

                <div class="small">Already have an account? <a href="login.html" style="font-weight:800">Login</a></div>
            </form>
        </section>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            // place your registration logic here
            alert('Registration logic goes here.'); // small demo feedback
        });
    </script>
</body>

</html>
