<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lujiazui - Travel Shanghai</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --accent: #dc143c;
      /* Crimson - màu hồng đỏ chủ đạo */
      --glass-border: rgba(220, 20, 60, 0.3);
      /* Hồng đỏ mờ cho border */
      --glass-bg: linear-gradient(180deg,
          rgba(220, 20, 60, 0.1),
          rgba(220, 20, 60, 0.05));
      /* Gradient hồng đỏ mờ */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100vh;
      font-family: "Nunito", system-ui, Arial;
      background: url(bcg.png) center/cover no-repeat fixed;
      color: #000000;
      /* Đen */
    }

    /* Header với glass effect hồng đỏ */
    .header {
      background: linear-gradient(180deg,
          rgba(220, 20, 60, 0.6),
          rgba(220, 20, 60, 0.2));
      padding: 18px 28px;
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      justify-content: flex-end;
    }

    .nav {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav a {
      color: #000000;
      /* Đen */
      text-decoration: none;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 8px;
      transition: all 0.3s ease;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.65);
      background: rgba(255, 228, 225, 0.1);
      /* Hồng nhạt mờ */
    }

    .nav a:hover {
      background: rgba(255, 228, 225, 0.2);
      transform: translateY(-2px);
    }

    /* Welcome section với glass card hồng đỏ */
    .hero {
      min-height: calc(100vh - 200px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .glass {
      width: 90%;
      max-width: 1200px;
      background: var(--glass-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 40px rgba(220, 20, 60, 0.4);
      /* Hồng đỏ shadow */
    }

    .welcome-text {
      text-align: center;
      margin-bottom: 40px;
    }

    .welcome-text h1 {
      font-size: 48px;
      margin-bottom: 20px;
      color: #000000;
      /* Đen */
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .welcome-text p {
      font-size: 18px;
      line-height: 1.6;
      color: rgba(0, 0, 0, 0.9);
      /* Đen mờ */
    }

    /* Gallery section */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .gallery-item {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
    }

    .gallery-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    /* Nút quay lại */
    .back-btn {
      display: block;
      margin: 40px auto 0;
      padding: 12px 24px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      transition: all 0.3s ease;
      text-align: center;
      width: fit-content;
    }

    .back-btn:hover {
      background: rgba(220, 20, 60, 0.8);
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(0deg,
          rgba(220, 20, 60, 0.6),
          rgba(220, 20, 60, 0.2));
      color: rgba(0, 0, 0, 0.8);
      /* Đen mờ */
    }

    @media (max-width: 768px) {
      .glass {
        padding: 20px;
      }

      .welcome-text h1 {
        font-size: 32px;
      }

      .nav {
        gap: 15px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="diemden.html">Place</a>
      <a href="amthuc.html">Food</a>
      <a href="#contact">Contact</a>
      <a href="#" id="logoutBtn" style="border: 1px solid rgba(220, 20, 60, 0.5)">Logout</a>
    </nav>
  </header>

  <main class="hero">
    <div class="glass">
      <div class="welcome-text">
        <h1>Lujiazui</h1>
        <p>Khám phá khu vực tài chính hiện đại với các tòa nhà chọc trời như Tháp Tài Chính Thượng Hải và Tháp Đông
          Phương Minh Châu, biểu tượng của sự phát triển kinh tế.</p>
      </div>
      <div class="gallery">
        <div class="gallery-item">
          <img src="img/lujiazui2.jpg" />
        </div>
        <div class="gallery-item">
          <img src="img/lujiazui3.jpg" />
        </div>
        <div class="gallery-item">
          <img src="img/lujiazui4.jpg" />
        </div>
        <div class="gallery-item">
          <img src="img/lujiazui5.jpg" />
        </div>
      </div>
      <a href="diemden.html" class="back-btn">Quay Lại Điểm Đến</a>
    </div>
  </main>

  <footer>
    <p>© 2025 Travel Shanghai. All rights reserved.</p>
  </footer>

  <script>
    // Lấy user từ session trước, nếu không có thì mới kiểm tra bản "remember"
    const currentUserRaw =
      sessionStorage.getItem("currentUser") ||
      localStorage.getItem("currentUser");

    if (!currentUserRaw) {
      window.location.href = "login.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      e.preventDefault();
      // xoá cả phiên hiện tại và remember
      localStorage.removeItem("currentUser");
      localStorage.removeItem("rememberMe");
      sessionStorage.removeItem("currentUser");
      sessionStorage.removeItem("loggedIn");
      sessionStorage.removeItem("userEmail");
      window.location.href = "login.html";
    });
  </script>
</body>

</html>
